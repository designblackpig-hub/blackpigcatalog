<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK PIG DESIGN - แคตตาล็อกสินค้าและบริการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between" x-data="blackPigApp()">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'home'; selectedGroup = null;">
                <span class="text-2xl font-bold tracking-wider text-amber-400">BLACK PIG DESIGN</span>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Social Links -->
                <div class="hidden md:flex items-center space-x-3">
                    <a href="https://www.facebook.com/blackpigdesign/" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">Facebook</a>
                    <a href="https://www.instagram.com/blackpigdesign?stkn=Z3d4YWpkcmcyOHU1&utm_source=qr" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">IG</a>
                    <a href="https://www.tiktok.com/@blackpigdesign1?is_from_webapp=1&sender_device=pc" target="_blank" class="bg-black hover:bg-gray-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition border border-gray-700">TikTok</a>
                    <a href="https://lin.ee/8iLNK3h" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">LINE@</a>
                </div>

                <!-- Admin Button -->
                <button @click="isAdminOpen = true" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-4 py-2 rounded-lg font-semibold text-sm transition shadow">
                    <span x-text="isLoggedIn ? 'เมนูจัดการแอดมิน' : 'เข้าสู่ระบบแอดมิน'"></span>
                </button>
            </div>
        </div>
        <div class="md:hidden bg-slate-800 px-4 py-2 flex justify-around border-t border-slate-700 text-xs">
            <a href="https://www.facebook.com/blackpigdesign/" target="_blank" class="text-blue-400 font-medium">Facebook</a>
            <a href="https://www.instagram.com/blackpigdesign?stkn=Z3d4YWpkcmcyOHU1&utm_source=qr" target="_blank" class="text-pink-400 font-medium">Instagram</a>
            <a href="https://www.tiktok.com/@blackpigdesign1?is_from_webapp=1&sender_device=pc" target="_blank" class="text-gray-200 font-medium">TikTok</a>
            <a href="https://lin.ee/8iLNK3h" target="_blank" class="text-emerald-400 font-medium">LINE@</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Breadcrumb / Back button when viewing group -->
        <template x-if="selectedGroup !== null">
            <div class="mb-6 flex items-center justify-between">
                <button @click="selectedGroup = null" class="bg-gray-200 hover:bg-gray-300 text-slate-800 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <span>&larr; กลับหน้าหมวดหมู่สินค้า</span>
                </button>
                <h2 class="text-2xl font-bold text-slate-900" x-text="getGroupName(selectedGroup)"></h2>
            </div>
        </template>

        <template x-if="selectedGroup === null">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">แคตตาล็อกสินค้าและบริการ BLACK PIG DESIGN</h1>
                <p class="text-gray-600">เลือกหมวดหมู่สินค้าที่คุณต้องการชม</p>
            </div>
        </template>

        <!-- VIEW 1: Product Groups Grid -->
        <template x-if="selectedGroup === null">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <template x-for="group in groups" :key="group.id">
                    <div @click="selectedGroup = group.id" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="w-full h-48 bg-gray-100 overflow-hidden relative">
                                <img :src="group.image || 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop&q=60'" alt="รูปหมวดหมู่" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" @error="$event.target.src='https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop&q=60'">
                            </div>
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-slate-900 mb-1" x-text="group.name"></h3>
                                <p class="text-gray-500 text-sm" x-text="getItemsCount(group.id) + ' รายการสินค้า'"></p>
                            </div>
                        </div>
                        <div class="p-6 pt-0">
                            <span class="block text-center bg-slate-900 text-white text-sm px-4 py-2 rounded-lg group-hover:bg-amber-500 group-hover:text-slate-900 transition font-medium">ดูสินค้าในหมวดหมู่นี้</span>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- VIEW 2: Products Inside Group -->
        <template x-if="selectedGroup !== null">
            <div>
                <template x-if="getProductsByGroup(selectedGroup).length === 0">
                    <div class="text-center py-16 bg-white rounded-xl border border-dashed border-gray-300">
                        <p class="text-gray-500 mb-2">ยังไม่มีสินค้าในหมวดหมู่นี้</p>
                        <p class="text-xs text-gray-400">แอดมินสามารถเพิ่มสินค้าได้ผ่านเมนูจัดการหลังบ้าน</p>
                    </div>
                </template>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <template x-for="product in getProductsByGroup(selectedGroup)" :key="product.id">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="w-full h-56 bg-gray-100 relative overflow-hidden">
                                    <img :src="fixImageUrl(product.image)" alt="รูปสินค้า" class="w-full h-full object-cover" @error="$event.target.src='https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&auto=format&fit=crop&q=60'">
                                    <span class="absolute top-2 left-2 bg-slate-900/80 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-md shadow" x-text="'รหัส: ' + product.code"></span>
                                </div>
                                <div class="p-6">
                                    <h3 class="text-xl font-bold text-slate-900 mb-2" x-text="product.title"></h3>
                                    <p class="text-gray-600 text-sm mb-4" x-text="product.desc"></p>
                                </div>
                            </div>
                            <div class="p-6 pt-0">
                                <button @click="orderProduct(product)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition shadow flex items-center justify-center space-x-2">
                                    <span>เลือกสินค้านี้ (สั่งซื้อ/สอบถามทาง LINE)</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-6 text-center text-sm">
        <p>&copy; 2026 BLACK PIG DESIGN. All rights reserved.</p>
    </footer>

    <!-- Admin Modal -->
    <div x-show="isAdminOpen" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" style="display: none;">
        <div @click.outside="isAdminOpen = false" class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button @click="isAdminOpen = false" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>

            <!-- Not Logged In -->
            <template x-if="!isLoggedIn">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-4">เข้าสู่ระบบแอดมิน</h2>
                    <form @submit.prevent="login">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                            <input type="password" x-model="passwordInput" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                        </div>
                        <p x-show="loginError" class="text-red-500 text-sm mb-4">รหัสผ่านไม่ถูกต้อง</p>
                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded-lg transition">เข้าสู่ระบบ</button>
                    </form>
                    <div class="mt-4 text-center">
                        <button @click="forgotPassword" class="text-sm text-blue-600 hover:underline">ลืมรหัสผ่าน?</button>
                    </div>
                </div>
            </template>

            <!-- Logged In / Admin Dashboard -->
            <template x-if="isLoggedIn">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b pb-2">ระบบจัดการหลังบ้าน BLACK PIG DESIGN</h2>
                    
                    <!-- TAB NAVIGATION -->
                    <div class="flex space-x-2 mb-6 border-b pb-4">
                        <button @click="adminTab = 'products'" :class="adminTab === 'products' ? 'bg-slate-900 text-white' : 'bg-gray-100 text-gray-700'" class="px-4 py-2 rounded-lg text-sm font-semibold transition">จัดการสินค้า</button>
                        <button @click="adminTab = 'groups'" :class="adminTab === 'groups' ? 'bg-slate-900 text-white' : 'bg-gray-100 text-gray-700'" class="px-4 py-2 rounded-lg text-sm font-semibold transition">จัดการหมวดหมู่ (Group)</button>
                        <button @click="adminTab = 'password'" :class="adminTab === 'password' ? 'bg-slate-900 text-white' : 'bg-gray-100 text-gray-700'" class="px-4 py-2 rounded-lg text-sm font-semibold transition">เปลี่ยนรหัสผ่าน</button>
                    </div>

                    <!-- TAB 1: MANAGE PRODUCTS -->
                    <template x-if="adminTab === 'products'">
                        <div>
                            <div class="mb-6 p-4 bg-gray-50 rounded-xl border">
                                <h3 class="font-bold text-slate-900 mb-3">➕ เพิ่มสินค้าใหม่ (รหัสสินค้าจะรันอัตโนมัติ)</h3>
                                <form @submit.prevent="addProduct">
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">เลือกหมวดหมู่สินค้า</label>
                                        <select x-model="newProduct.groupId" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" required>
                                            <option value="">-- เลือกหมวดหมู่ --</option>
                                            <template x-for="g in groups" :key="g.id">
                                                <option :value="g.id" x-text="g.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อสินค้า / ตัวอย่างงาน</label>
                                        <input type="text" x-model="newProduct.title" placeholder="เช่น การ์ดงานแต่งแบบมินิมอล" class="w-full px-3 py-2 border rounded-lg text-sm" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">รายละเอียดสินค้า</label>
                                        <textarea x-model="newProduct.desc" placeholder="รายละเอียด เช่น ขนาด, ชนิดกระดาษ..." class="w-full px-3 py-2 border rounded-lg text-sm" rows="2" required></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">ลิงก์รูปภาพ (รองรับ Google Drive หรือลิงก์รูปทั่วไป)</label>
                                        <input type="text" x-model="newProduct.image" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg text-sm" required>
                                    </div>
                                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">บันทึกเพิ่มสินค้า</button>
                                </form>
                            </div>

                            <!-- Product List -->
                            <div class="p-4 bg-gray-50 rounded-xl border">
                                <h3 class="font-bold text-slate-900 mb-3">📋 รายการสินค้าทั้งหมด</h3>
                                <div class="space-y-2 max-h-60 overflow-y-auto">
                                    <template x-for="(prod, index) in products" :key="prod.id">
                                        <div class="flex justify-between items-center bg-white p-3 rounded-lg border text-sm">
                                            <div>
                                                <span class="font-bold text-amber-600 mr-2" x-text="'[' + prod.code + ']'"></span>
                                                <span class="font-medium text-slate-800" x-text="prod.title"></span>
                                            </div>
                                            <button @click="deleteProduct(index)" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 bg-red-50 rounded border border-red-200">ลบ</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- TAB 2: MANAGE GROUPS -->
                    <template x-if="adminTab === 'groups'">
                        <div>
                            <div class="mb-6 p-4 bg-gray-50 rounded-xl border">
                                <h3 class="font-bold text-slate-900 mb-3">➕ เพิ่มหมวดหมู่สินค้าใหม่ (Product Group)</h3>
                                <form @submit.prevent="addGroup">
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อหมวดหมู่</label>
                                        <input type="text" x-model="newGroup.name" placeholder="เช่น การ์ดงานบวช" class="w-full px-3 py-2 border rounded-lg text-sm" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="block text-xs font-medium text-gray-600 mb-1">ลิงก์รูปภาพปกหมวดหมู่</label>
                                        <input type="text" x-model="newGroup.image" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg text-sm" required>
                                    </div>
                                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">บันทึกเพิ่มหมวดหมู่</button>
                                </form>
                            </div>

                            <!-- Groups List -->
                            <div class="p-4 bg-gray-50 rounded-xl border">
                                <h3 class="font-bold text-slate-900 mb-3">📁 หมวดหมู่ทั้งหมด</h3>
                                <div class="space-y-2 max-h-60 overflow-y-auto">
                                    <template x-for="(g, index) in groups" :key="g.id">
                                        <div class="flex justify-between items-center bg-white p-3 rounded-lg border text-sm">
                                            <span class="font-medium text-slate-800" x-text="g.name"></span>
                                            <button @click="deleteGroup(index)" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 bg-red-50 rounded border border-red-200">ลบ</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- TAB 3: CHANGE PASSWORD -->
                    <template x-if="adminTab === 'password'">
                        <div class="p-4 bg-gray-50 rounded-xl border">
                            <h3 class="font-bold text-slate-900 mb-3">เปลี่ยนรหัสผ่านแอดมิน</h3>
                            <form @submit.prevent="changePassword">
                                <div class="mb-3">
                                    <input type="password" x-model="newPassword" placeholder="รหัสผ่านใหม่" class="w-full px-3 py-2 border rounded-lg text-sm" required>
                                </div>
                                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-sm transition">บันทึกรหัสผ่านใหม่</button>
                            </form>
                            <p x-show="passChanged" class="text-emerald-600 text-xs mt-2">เปลี่ยนรหัสผ่านสำเร็จ!</p>
                        </div>
                    </template>

                    <div class="mt-6 pt-4 border-t">
                        <button @click="logout" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg transition">ออกจากระบบ</button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function blackPigApp() {
            return {
                isAdminOpen: false,
                isLoggedIn: sessionStorage.getItem('blackpig_logged') === 'true',
                passwordInput: '',
                newPassword: '',
                loginError: false,
                passChanged: false,
                adminTab: 'products',
                selectedGroup: null,

                newGroup: { name: '', image: '' },
                newProduct: { groupId: '', title: '', desc: '', image: '' },

                // Default Groups
                defaultGroups: [
                    { id: 'wedding', name: 'การ์ดงานแต่ง / งานบวช', image: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=500&auto=format&fit=crop&q=60' },
                    { id: 'sticker', name: 'สติ๊กเกอร์ฉลากสินค้า', image: 'https://images.unsplash.com/photo-1572375309923-c9e74ce6d813?w=500&auto=format&fit=crop&q=60' },
                    { id: 'sign', name: 'ป้ายไวนิล / ฟิวเจอร์บอร์ด', image: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=500&auto=format&fit=crop&q=60' }
                ],

                // Default Products
                defaultProducts: [
                    { id: 1, groupId: 'wedding', code: 'WED-001', title: 'การ์ดแต่งงานพรีเมียม (อาร์ตมัน 260 แกรม)', desc: 'ขนาด 4x6 นิ้ว พร้อมซอง ฟรีออกแบบ', image: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=500&auto=format&fit=crop&q=60' },
                    { id: 2, groupId: 'sticker', code: 'STK-001', title: 'สติ๊กเกอร์ฉลากสินค้ากันน้ำ ไดคัท', desc: 'เนื้อเงา/ด้าน ไดคัทตามทรงสวยงาม', image: 'https://images.unsplash.com/photo-1572375309923-c9e74ce6d813?w=500&auto=format&fit=crop&q=60' },
                    { id: 3, groupId: 'sign', code: 'SGN-001', title: 'ป้ายไวนิลหน้าร้าน คมชัด ทนแดด', desc: 'พับขอบ เจาะตาไก่ พร้อมใช้งาน ฟรีออกแบบ', image: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=500&auto=format&fit=crop&q=60' }
                ],

                get groups() {
                    let saved = localStorage.getItem('blackpig_groups');
                    return saved ? JSON.parse(saved) : this.defaultGroups;
                },

                get products() {
                    let saved = localStorage.getItem('blackpig_products');
                    return saved ? JSON.parse(saved) : this.defaultProducts;
                },

                getGroupName(groupId) {
                    let g = this.groups.find(x => x.id === groupId);
                    return g ? g.name : 'สินค้าทั้งหมด';
                },

                getItemsCount(groupId) {
                    return this.products.filter(p => p.groupId === groupId).length;
                },

                getProductsByGroup(groupId) {
                    return this.products.filter(p => p.groupId === groupId);
                },

                fixImageUrl(url) {
                    if (!url) return '';
                    // แปลงลิงก์ Google Drive ให้แสดงผลรูปภาพได้จริง
                    if (url.includes('drive.google.com') && url.includes('id=')) {
                        let idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
                        if (idMatch && idMatch[1]) {
                            return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
                        }
                    } else if (url.includes('drive.google.com/file/d/')) {
                        let idMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                        if (idMatch && idMatch[1]) {
                            return 'https://lh3.googleusercontent.com/d/' + idMatch[1];
                        }
                    }
                    return url;
                },

                orderProduct(product) {
                    let text = `สวัสดีค่ะ BLACK PIG DESIGN สนใจสั่งซื้อสินค้า/สอบถามข้อมูล:
รหัสสินค้า: ${product.code}
ชื่อสินค้า: ${product.title}
รายละเอียด: ${product.desc}`;
                    let encoded = encodeURIComponent(text);
                    window.open(`https://lin.ee/8iLNK3h`, '_blank');
                },

                addGroup() {
                    if(this.newGroup.name && this.newGroup.image) {
                        let list = this.groups;
                        let newId = 'grp_' + Date.now();
                        list.push({ id: newId, name: this.newGroup.name, image: this.newGroup.image });
                        localStorage.setItem('blackpig_groups', JSON.stringify(list));
                        this.newGroup = { name: '', image: '' };
                        alert('เพิ่มหมวดหมู่สำเร็จ!');
                    }
                },

                deleteGroup(index) {
                    if(confirm('ต้องการลบหมวดหมู่นี้ใช่ไหม?')) {
                        let list = this.groups;
                        let groupId = list[index].id;
                        list.splice(index, 1);
                        localStorage.setItem('blackpig_groups', JSON.stringify(list));
                        // ลบสินค้าในกลุ่มนี้ด้วย
                        let prods = this.products.filter(p => p.groupId !== groupId);
                        localStorage.setItem('blackpig_products', JSON.stringify(prods));
                    }
                },

                addProduct() {
                    if(this.newProduct.groupId && this.newProduct.title && this.newProduct.desc && this.newProduct.image) {
                        let prods = this.products;
                        // สร้างรหัสสินค้าอัตโนมัติ (เช่น GRP-001)
                        let prefix = this.newProduct.groupId.substring(0, 3).toUpperCase();
                        let groupProds = prods.filter(p => p.groupId === this.newProduct.groupId);
                        let nextNum = groupProds.length + 1;
                        let code = prefix + '-' + String(nextNum).padStart(3, '0');

                        prods.unshift({
                            id: Date.now(),
                            groupId: this.newProduct.groupId,
                            code: code,
                            title: this.newProduct.title,
                            desc: this.newProduct.desc,
                            image: this.newProduct.image
                        });
                        localStorage.setItem('blackpig_products', JSON.stringify(prods));
                        this.newProduct = { groupId: '', title: '', desc: '', image: '' };
                        alert('เพิ่มสินค้าสำเร็จ! รหัสสินค้า: ' + code);
                    }
                },

                deleteProduct(index) {
                    if(confirm('ต้องการลบสินค้านี้ใช่ไหม?')) {
                        let prods = this.products;
                        prods.splice(index, 1);
                        localStorage.setItem('blackpig_products', JSON.stringify(prods));
                    }
                },

                getSavedPassword() {
                    return localStorage.getItem('blackpig_admin_pass') || '123456';
                },
                login() {
                    if (this.passwordInput === this.getSavedPassword()) {
                        this.isLoggedIn = true;
                        sessionStorage.setItem('blackpig_logged', 'true');
                        this.loginError = false;
                        this.passwordInput = '';
                    } else {
                        this.loginError = true;
                    }
                },
                logout() {
                    this.isLoggedIn = false;
                    sessionStorage.removeItem('blackpig_logged');
                },
                changePassword() {
                    if (this.newPassword.trim() !== '') {
                        localStorage.setItem('blackpig_admin_pass', this.newPassword);
                        this.passChanged = true;
                        this.newPassword = '';
                        setTimeout(() => this.passChanged = false, 3000);
                    }
                },
                forgotPassword() {
                    alert('รหัสผ่านเริ่มต้นคือ: 123456');
                }
            }
        }
    </script>
</body>
</html>
